      "listen": "127.0.0.1",
      "port": 10808,
      "protocol": "mixed",
      "settings": {
        "udp": true
      },
      "tag": "mixed"
    }
  ],
  "outbounds": [
    {
      "protocol": "vmess",
      "settings": {
