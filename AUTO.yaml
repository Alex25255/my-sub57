              {
                "id": "b8a8d84a-56d0-4bd0-a8a5-b6d674216719",
                "alterId": 0,
                "security": "auto"
              }
            ]
          }
        ]
      },
      "streamSettings": {
        "network": "ws",
        "security": "tls",
        "tlsSettings": {
          "serverName": "renderer-stream-1-794.mirra.now",
          "fingerprint": "firefox",
          "alpn": [
            "h2"
          ]
        },
        "wsSettings": {
          "path": "/api/v1/gpu-stream/socket",
          "headers": {
            "Host": "renderer-stream-1-794.mirra.now"
          }
        }
      },
      "tag": "NL"
    },
    {
      "protocol": "vmess",
      "settings": {
        "vnext": [
          {
