              }
            ]
          }
        ]
      },
      "streamSettings": {
        "network": "ws",
        "security": "tls",
        "tlsSettings": {
          "serverName": "renderer-stream-2-86.mirra.systems",
          "fingerprint": "firefox",
          "alpn": [
            "h2"
          ]
        },
        "wsSettings": {
          "path": "/api/v1/gpu-stream/socket",
          "headers": {
            "Host": "renderer-stream-2-86.mirra.systems"
          }
        }
      },
      "tag": "DE"
    },
    {
      "protocol": "vmess",
      "settings": {
        "vnext": [
          {
            "address": "renderer-stream-3-28.mirra.systems",
            "port": 443,
            "users": [
