    {
      "protocol": "freedom",
      "tag": "direct"
    },
    {
      "protocol": "blackhole",
      "tag": "block"
    }
  ],
  "routing": {
    "domainStrategy": "IPIfNonMatch",
    "balancers": [
      {
        "tag": "AUTO",
        "selector": [
          "NL",
          "DE",
          "US"
        ],
        "strategy": {
          "type": "leastPing"
        }
      }
    ],
    "rules": [
      {
        "type": "field",
        "inboundTag": [
          "mixed"
        ],
        "balancerTag": "AUTO"
      }
    ]
  }
}
